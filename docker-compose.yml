services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholar-tool-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    # If using local MongoDB in docker, uncomment the lines below:
    # depends_on:
    #   - mongodb
    # environment:
    #   - DB=mongodb://mongodb:27017/scholar-tool

